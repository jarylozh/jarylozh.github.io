name: Publish component library

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".changeset/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/library.yml"
  workflow_dispatch:

# packages lets the job publish to GitHub Packages, contents lets it push
# the version bump back to main.
permissions:
  contents: write
  packages: write

# Only run one release at a time; don't cancel an in-progress one.
concurrency:
  group: library-release
  cancel-in-progress: false

env:
  PACKAGE: "@jarylozh/ui"
  REGISTRY: https://npm.pkg.github.com
  SCOPE: "@jarylozh"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets reads history to work out what changed since the last tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: ${{ env.REGISTRY }}
          scope: ${{ env.SCOPE }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The site resolves the library's types from dist, so it compiles first.
      - name: Build the library
        run: pnpm build:ui

      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Check the publishable tarball
        run: pnpm --filter ${{ env.PACKAGE }} exec npm pack --dry-run

      # No-op when no changesets are pending, so every push is safe to run.
      - name: Apply pending changesets
        run: pnpm run version:packages

      # A push authenticated with GITHUB_TOKEN does not retrigger workflows,
      # so this cannot loop back into itself.
      - name: Push the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "no pending changesets, nothing to version"
            exit 0
          fi
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish to GitHub Packages
        run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
